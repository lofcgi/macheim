name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release metadata and bundled plugin
        run: npm run verify:release

      - name: Regression tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Setup .NET for pure shader policy tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Shader policy and pixel tests (no game assets required)
        run: dotnet run --project tools/item-material-compat/tests/PolicyTests.csproj -c Release

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Macheim ${{ github.ref_name }}'
          releaseBody: |
            ## Macheim ${{ github.ref_name }}

            Valheim Mod Manager for macOS.

            ### What's new in 1.3.3
            - **Play Modded** checks for Rosetta first on Apple Silicon. If it is missing, Macheim shows how to install it (`softwareupdate --install-rosetta --agree-to-license`) instead of a Terminal window that only says `Bad CPU type in executable` (#29).
            - The **Steam overlay** (Shift+Tab) is loaded in modded games. Macheim now injects Steam's overlay libraries next to BepInEx, the same way Steam does when it starts the game itself (#30).
            - Includes the Steam app id launch fix and Installed Mods **Change version** from 1.3.2.

            ### Compatibility limits
            The bundled visual patch targets Valheim 0.221.12 / Unity 6000.0.61f1 / Metal and requires ShaderHelperForMac 3.3.0.
            It does not fix every mod, monster, building or UI icon. Unknown versions are skipped.
            Macheim's Apple Silicon app still launches the modded game through Rosetta.
            Both catalogs must load successfully. Mixed-source support is not automatic cross-repository migration, PC profile-code import, or a guarantee that arbitrary mods work together.
            See RELEASE-1.3.3.md for QA evidence and known limitations. User-specific download errors still require the exact error and package details; backpack shaders and newer game/Unity versions are not newly supported by this release.

            ### Installation
            1. Download the `.dmg` file for your Mac
            2. Open and drag **Macheim** to Applications
            3. Open **System Settings → Privacy & Security** and click **Open Anyway** if macOS blocks the app

            This release is ad-hoc signed, but not Apple-notarized. If macOS reports that
            Macheim is damaged and does not offer **Open Anyway**, run:

            ```sh
            xattr -cr /Applications/Macheim.app
            ```

            Then open Macheim normally. Only use this command after confirming that you
            downloaded the app from this repository's Releases page.

            **Apple Silicon (M1/M2/M3/M4):** Download `aarch64.dmg`
            **Intel Mac:** Download the DMG ending in `_x64.dmg`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
